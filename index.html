<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff9ee">

  <title>持久走・周回カウンター</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="app">

    <!-- 役割選択 -->
    <section id="roleScreen" class="screen role-screen">
      <div class="role-panel">
        <h1>この端末の役割を選んでください</h1>

        <label class="role-option">
          <input
            type="radio"
            name="role"
            value="A"
            checked
          >
          <span>A：周回記録・設定（親機）</span>
        </label>

        <label class="role-option">
          <input
            type="radio"
            name="role"
            value="B"
          >
          <span>B：ゴール記録（最後の−1だけ）</span>
        </label>

        <label class="field-label" for="roomKey">
          接続キー
        </label>

        <input
          id="roomKey"
          class="key-input"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Aに表示されるキー"
          disabled
        >

        <p class="role-help">
          Aを先に起動してください。<br>
          BはAの画面上部に表示される接続キーを入力します。<br>
          Aを選ぶ場合、接続キーの入力は不要です。
        </p>

        <button id="launchButton" class="launch-button">
          起動
        </button>

        <p id="roleError" class="error-message" aria-live="polite"></p>
      </div>
    </section>

    <!-- A/B共通のヘッダー -->
    <header id="connectionHeader" class="connection-header hidden">
      <div class="connection-top">
        <div id="connectionInfo" class="connection-info"></div>

        <button id="leaveButton" class="small-button">
          役割選択へ
        </button>
      </div>

      <div id="connectionStatus" class="connection-status"></div>

      <div id="notice" class="notice" aria-live="polite"></div>
    </header>

    <!-- 人数選択 -->
    <section id="setupScreen" class="screen setup-screen hidden">
      <div class="setup-heading">
        <h1>持久走・周回カウンター</h1>
        <p>みんなで楽しく、最後まで走ろう！</p>
      </div>

      <div class="illustration-wrap">
        <svg
          class="illustration"
          viewBox="0 0 900 320"
          role="img"
          aria-label="トラックを走る子どもたちのイラスト"
        >
          <rect
            x="15" y="10" width="870" height="290"
            rx="12" fill="#e8f8ff"
          />

          <!-- 雲 -->
          <g fill="#fff">
            <ellipse cx="165" cy="65" rx="62" ry="25" />
            <ellipse cx="150" cy="53" rx="28" ry="25" />

            <ellipse cx="435" cy="55" rx="58" ry="23" />
            <ellipse cx="420" cy="43" rx="26" ry="23" />

            <ellipse cx="635" cy="78" rx="60" ry="24" />
            <ellipse cx="620" cy="65" rx="27" ry="24" />
          </g>

          <!-- 太陽 -->
          <circle cx="775" cy="60" r="35" fill="#ffd56b" />
          <circle cx="764" cy="55" r="3" fill="#8d6a39" />
          <circle cx="786" cy="55" r="3" fill="#8d6a39" />
          <path
            d="M765 70 Q775 79 785 70"
            fill="none"
            stroke="#8d6a39"
            stroke-width="3"
            stroke-linecap="round"
          />

          <!-- 芝生とトラック -->
          <path d="M15 205 H885 V300 H15 Z" fill="#d8f2c5" />
          <ellipse cx="450" cy="240" rx="385" ry="66" fill="#f6c9a8" />
          <ellipse cx="450" cy="236" rx="305" ry="43" fill="#d8f2c5" />
          <ellipse
            cx="450" cy="240" rx="350" ry="56"
            fill="none" stroke="#fff" stroke-width="3"
          />

          <!-- 花 -->
          <g fill="#ff9ebb" stroke="#6aa568" stroke-width="2">
            <circle cx="90" cy="230" r="6" />
            <path d="M90 236 V252" />
            <circle cx="815" cy="230" r="6" />
            <path d="M815 236 V252" />
          </g>

          <!-- ランナー1 -->
          <g transform="translate(260 115)">
            <path
              d="M-10 70 L-35 105 M12 70 L38 90 L55 80"
              fill="none" stroke="#ffd9ba"
              stroke-width="13" stroke-linecap="round"
            />
            <path
              d="M-18 35 L-45 45 L-55 25 M18 35 L42 18 L58 25"
              fill="none" stroke="#ffd9ba"
              stroke-width="11" stroke-linecap="round"
            />
            <path d="M-22 24 H22 L27 69 H-25 Z" fill="#71cff0" />
            <path d="M-25 66 H27 L20 80 H-18 Z" fill="#54758a" />
            <circle cx="0" cy="-5" r="28" fill="#6d4f42" />
            <circle cx="0" cy="1" r="23" fill="#ffe1c5" />
            <path d="M-25 -10 Q-12 -36 15 -28 L26 -8 L7 -16 L-4 -8 L-12 -18 Z"
                  fill="#6d4f42" />
            <circle cx="-9" cy="0" r="2.5" fill="#574d48" />
            <circle cx="9" cy="0" r="2.5" fill="#574d48" />
            <path d="M-5 10 Q0 15 6 10" fill="none" stroke="#9e6258" stroke-width="2" />
            <rect x="-11" y="36" width="22" height="20" fill="#fff" />
            <text x="0" y="51" text-anchor="middle" font-size="14" fill="#4e6d80">1</text>
          </g>

          <!-- ランナー2 -->
          <g transform="translate(450 105)">
            <path
              d="M-10 70 L-35 105 M12 70 L38 90 L55 80"
              fill="none" stroke="#ffd9ba"
              stroke-width="13" stroke-linecap="round"
            />
            <path
              d="M-18 35 L-45 45 L-55 25 M18 35 L42 18 L58 25"
              fill="none" stroke="#ffd9ba"
              stroke-width="11" stroke-linecap="round"
            />
            <path d="M-22 24 H22 L27 69 H-25 Z" fill="#ff9cb6" />
            <path d="M-25 66 H27 L20 80 H-18 Z" fill="#54758a" />
            <circle cx="-25" cy="-12" r="15" fill="#6d4f42" />
            <circle cx="0" cy="-5" r="28" fill="#6d4f42" />
            <circle cx="0" cy="1" r="23" fill="#ffe1c5" />
            <path d="M-25 -10 Q-12 -36 15 -28 L26 -8 L7 -16 L-4 -8 L-12 -18 Z"
                  fill="#6d4f42" />
            <circle cx="-9" cy="0" r="2.5" fill="#574d48" />
            <circle cx="9" cy="0" r="2.5" fill="#574d48" />
            <path d="M-5 10 Q0 15 6 10" fill="none" stroke="#9e6258" stroke-width="2" />
            <rect x="-11" y="36" width="22" height="20" fill="#fff" />
            <text x="0" y="51" text-anchor="middle" font-size="14" fill="#4e6d80">2</text>
          </g>

          <!-- ランナー3 -->
          <g transform="translate(640 125)">
            <path
              d="M-10 70 L-35 105 M12 70 L38 90 L55 80"
              fill="none" stroke="#ffd9ba"
              stroke-width="13" stroke-linecap="round"
            />
            <path
              d="M-18 35 L-45 45 L-55 25 M18 35 L42 18 L58 25"
              fill="none" stroke="#ffd9ba"
              stroke-width="11" stroke-linecap="round"
            />
            <path d="M-22 24 H22 L27 69 H-25 Z" fill="#ffd66f" />
            <path d="M-25 66 H27 L20 80 H-18 Z" fill="#54758a" />
            <circle cx="0" cy="-5" r="28" fill="#6d4f42" />
            <circle cx="0" cy="1" r="23" fill="#ffe1c5" />
            <path d="M-25 -10 Q-12 -36 15 -28 L26 -8 L7 -16 L-4 -8 L-12 -18 Z"
                  fill="#6d4f42" />
            <circle cx="-9" cy="0" r="2.5" fill="#574d48" />
            <circle cx="9" cy="0" r="2.5" fill="#574d48" />
            <path d="M-5 10 Q0 15 6 10" fill="none" stroke="#9e6258" stroke-width="2" />
            <rect x="-11" y="36" width="22" height="20" fill="#fff" />
            <text x="0" y="51" text-anchor="middle" font-size="14" fill="#4e6d80">3</text>
          </g>

          <text
            x="450" y="295"
            text-anchor="middle"
            font-size="18"
            font-weight="bold"
            fill="#54815a"
          >
            自分のペースで、がんばろう！
          </text>
        </svg>
      </div>

      <div class="setup-controls">
        <label for="studentCount">ランナーの人数</label>

        <input
          id="studentCount"
          type="number"
          min="1"
          max="40"
          value="20"
          inputmode="numeric"
        >

        <span>名</span>
      </div>

      <button id="prepareButton" class="next-button">
        次の画面へ ▶
      </button>

      <p class="setup-help">
        A：設定・スタート・通常の周回記録<br>
        B：残り1周からの最後の−1だけ<br>
        Aが画面を進めると、Bも同じ画面に切り替わります。
      </p>
    </section>

    <!-- 記録画面 -->
    <section id="counterScreen" class="screen counter-screen hidden">
      <div class="counter-toolbar">
        <h1>持久走・周回カウンター</h1>

        <button id="startButton" class="start-button">
          ▶ スタート
        </button>

        <div id="timer" class="timer">00:00.00</div>

        <button id="setupButton" class="small-button">
          設定へ
        </button>
      </div>

      <div id="counterHelp" class="counter-help"></div>

      <div id="studentGrid" class="student-grid"></div>
    </section>

    <!-- 生徒設定 -->
    <dialog id="editDialog">
      <form id="editForm">
        <h2>ランナーの設定</h2>

        <label for="editName">名前</label>
        <input id="editName" type="text" maxlength="100" required>

        <label for="editTarget">目標周数</label>
        <input
          id="editTarget"
          type="number"
          min="1"
          max="9999"
          required
        >

        <label class="checkbox-row">
          <input id="editReset" type="checkbox">
          <span>残り周数を目標周数に戻す</span>
        </label>

        <p class="dialog-help">
          目標周数の変更・リセットで完走記録も取り消されます。<br>
          共通タイマーはリセットされません。<br>
          完走の押し間違いはAの「＋1」で戻せます。
        </p>

        <div class="dialog-buttons">
          <button type="submit" class="dialog-save">保存</button>
          <button id="cancelEditButton" type="button">キャンセル</button>
        </div>
      </form>
    </dialog>

  </main>

  <script src="app.js"></script>
</body>
</html>
